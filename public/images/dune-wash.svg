<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 1200" preserveAspectRatio="none" aria-hidden="true">
  <!--
    Ondas de duna para el fondo del carril de viajes.

    Una sola gama: tierra clara, del arena al tostado. El relieve lo hacen la
    cresta de luz sobre cada lomo y el pie desvanecido, no el contraste de tono.

    Cada banda es simétrica respecto al centro del mosaico y entra y sale con la
    tangente horizontal. Eso es lo que hace invisible la costura al repetir:
    igualar sólo la altura de los extremos no basta —la pendiente heredada
    dibujaba un montículo en el empalme—, porque el navegador redondea el ancho
    del mosaico a píxeles enteros y cualquier inclinación delata el corte.
  -->
  <defs>
    <linearGradient id="lomo-claro" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#E7D3B6" stop-opacity="0.7"/>
      <stop offset="0.55" stop-color="#E7D3B6" stop-opacity="0.38"/>
      <stop offset="1" stop-color="#E7D3B6" stop-opacity="0.1"/>
    </linearGradient>
    <linearGradient id="lomo-medio" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#DCBE98" stop-opacity="0.66"/>
      <stop offset="0.6" stop-color="#DCBE98" stop-opacity="0.34"/>
      <stop offset="1" stop-color="#DCBE98" stop-opacity="0.08"/>
    </linearGradient>
    <linearGradient id="lomo-tostado" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#C9A67C" stop-opacity="0.54"/>
      <stop offset="0.62" stop-color="#C9A67C" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#C9A67C" stop-opacity="0.06"/>
    </linearGradient>
    <linearGradient id="hilo-tierra" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#B08E63" stop-opacity="0.3"/>
      <stop offset="0.5" stop-color="#B08E63" stop-opacity="0.34"/>
      <stop offset="1" stop-color="#B08E63" stop-opacity="0.3"/>
    </linearGradient>
    <linearGradient id="cresta" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FBF5EC" stop-opacity="0.6"/>
      <stop offset="0.5" stop-color="#FBF5EC" stop-opacity="0.8"/>
      <stop offset="1" stop-color="#FBF5EC" stop-opacity="0.6"/>
    </linearGradient>
  </defs>

  <!-- Lomo tostado: sube hacia el centro. -->
  <path fill="url(#lomo-tostado)"
        d="M0 336C240 336 480 244 720 244C960 244 1200 336 1440 336L1440 1200L0 1200Z"/>
  <path fill="none" stroke="url(#cresta)" stroke-width="2"
        d="M0 336C240 336 480 244 720 244C960 244 1200 336 1440 336"/>

  <!-- Lomo claro: baja hacia el centro, para cruzarse con el anterior. -->
  <path fill="url(#lomo-claro)"
        d="M0 402C240 402 480 486 720 486C960 486 1200 402 1440 402L1440 1200L0 1200Z"/>
  <path fill="none" stroke="url(#cresta)" stroke-width="2"
        d="M0 402C240 402 480 486 720 486C960 486 1200 402 1440 402"/>

  <!-- Lomo medio: el que marca el centro del mosaico. -->
  <path fill="url(#lomo-medio)"
        d="M0 764C240 764 480 682 720 682C960 682 1200 764 1440 764L1440 1200L0 1200Z"/>
  <path fill="none" stroke="url(#cresta)" stroke-width="2"
        d="M0 764C240 764 480 682 720 682C960 682 1200 764 1440 764"/>

  <!-- Lomo del pie. -->
  <path fill="url(#lomo-tostado)"
        d="M0 1064C240 1064 480 1128 720 1128C960 1128 1200 1064 1440 1064L1440 1200L0 1200Z"/>
  <path fill="none" stroke="url(#cresta)" stroke-width="1.8"
        d="M0 1064C240 1064 480 1128 720 1128C960 1128 1200 1064 1440 1064"/>

  <!-- Dos hilos de la misma gama cruzando el papel. -->
  <path fill="none" stroke="url(#hilo-tierra)" stroke-width="1.5"
        d="M0 188C240 188 480 122 720 122C960 122 1200 188 1440 188"/>
  <path fill="none" stroke="url(#hilo-tierra)" stroke-width="1.2"
        d="M0 926C240 926 480 986 720 986C960 986 1200 926 1440 926"/>
</svg>
