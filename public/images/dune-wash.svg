<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 1200" preserveAspectRatio="none" aria-hidden="true">
  <!--
    Fondo de página: dunas apiladas, hilos de oro y toques de oliva y granate.

    Las dunas se dibujan como en la referencia de la clienta —lomos que se
    solapan, con el filo claro arriba y el pie desvanecido—, no como ondas
    planas. Cada lomo lleva una cresta de luz encima: es lo que las hace leer
    como duna y no como mancha.

    Las formas se quedan lejos del filo superior e inferior del mosaico y los
    trazos nacen y mueren en transparente, así la costura entre repeticiones no
    se ve sin tener que empalmar el dibujo al píxel.

    Verde oliva y granate entran a petición expresa de la clienta; no están en
    design-system/MASTER.md y habría que registrarlos allí si se quedan.
  -->
  <defs>
    <linearGradient id="lomo-claro" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#E7D3B6" stop-opacity="0.7"/>
      <stop offset="0.55" stop-color="#E7D3B6" stop-opacity="0.38"/>
      <stop offset="1" stop-color="#E7D3B6" stop-opacity="0.1"/>
    </linearGradient>
    <linearGradient id="lomo-medio" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#DCBE98" stop-opacity="0.68"/>
      <stop offset="0.6" stop-color="#DCBE98" stop-opacity="0.34"/>
      <stop offset="1" stop-color="#DCBE98" stop-opacity="0.08"/>
    </linearGradient>
    <linearGradient id="lomo-oscuro" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#C9A67C" stop-opacity="0.55"/>
      <stop offset="0.62" stop-color="#C9A67C" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#C9A67C" stop-opacity="0.06"/>
    </linearGradient>
    <linearGradient id="lomo-oliva" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7C8663" stop-opacity="0.34"/>
      <stop offset="1" stop-color="#7C8663" stop-opacity="0.04"/>
    </linearGradient>
    <linearGradient id="lomo-granate" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9D3C23" stop-opacity="0.3"/>
      <stop offset="1" stop-color="#9D3C23" stop-opacity="0.03"/>
    </linearGradient>
    <linearGradient id="hilo-oro" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#A57430" stop-opacity="0"/>
      <stop offset="0.2" stop-color="#A57430" stop-opacity="0.5"/>
      <stop offset="0.8" stop-color="#A57430" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#A57430" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="hilo-oliva" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#6F7A5A" stop-opacity="0"/>
      <stop offset="0.24" stop-color="#6F7A5A" stop-opacity="0.42"/>
      <stop offset="0.76" stop-color="#6F7A5A" stop-opacity="0.42"/>
      <stop offset="1" stop-color="#6F7A5A" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="hilo-granate" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#9D3C23" stop-opacity="0"/>
      <stop offset="0.26" stop-color="#9D3C23" stop-opacity="0.4"/>
      <stop offset="0.74" stop-color="#9D3C23" stop-opacity="0.4"/>
      <stop offset="1" stop-color="#9D3C23" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="cresta" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FBF5EC" stop-opacity="0"/>
      <stop offset="0.3" stop-color="#FBF5EC" stop-opacity="0.85"/>
      <stop offset="0.7" stop-color="#FBF5EC" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#FBF5EC" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Primer grupo de dunas: lomo hondo detrás, lomo claro delante. -->
  <path fill="url(#lomo-oscuro)"
        d="M-20 340C120 252 300 232 470 288C640 344 764 288 930 254C1096 220 1300 268 1460 236V560H-20Z"/>
  <path fill="none" stroke="url(#cresta)" stroke-width="2"
        d="M-20 340C120 252 300 232 470 288C640 344 764 288 930 254C1096 220 1300 268 1460 236"/>

  <path fill="url(#lomo-claro)"
        d="M-20 430C160 352 336 420 520 404C712 388 852 318 1030 336C1204 354 1330 420 1460 392V620H-20Z"/>
  <path fill="none" stroke="url(#cresta)" stroke-width="2"
        d="M-20 430C160 352 336 420 520 404C712 388 852 318 1030 336C1204 354 1330 420 1460 392"/>

  <!-- Toque de oliva: un lomo bajo, detrás del segundo grupo. -->
  <path fill="url(#lomo-oliva)"
        d="M-20 690C180 626 352 690 540 672C742 652 900 600 1090 620C1254 638 1352 684 1460 664V860H-20Z"/>

  <!-- Segundo grupo: el que marca el centro del mosaico. -->
  <path fill="url(#lomo-medio)"
        d="M-20 770C170 700 330 764 520 780C726 798 880 720 1070 706C1244 694 1352 744 1460 722V960H-20Z"/>
  <path fill="none" stroke="url(#cresta)" stroke-width="2"
        d="M-20 770C170 700 330 764 520 780C726 798 880 720 1070 706C1244 694 1352 744 1460 722"/>

  <!-- Granate al pie: la nota cálida que cierra el mosaico. -->
  <path fill="url(#lomo-granate)"
        d="M-20 1010C200 944 420 1024 640 1042C880 1062 1100 986 1320 1004C1380 1010 1420 1018 1460 1012V1170H-20Z"/>
  <path fill="url(#lomo-oscuro)"
        d="M-20 1076C220 1014 452 1088 682 1102C918 1116 1140 1048 1360 1066C1400 1070 1430 1076 1460 1072V1200H-20Z"/>
  <path fill="none" stroke="url(#cresta)" stroke-width="1.8"
        d="M-20 1076C220 1014 452 1088 682 1102C918 1116 1140 1048 1360 1066C1400 1070 1430 1076 1460 1072"/>

  <!-- Hilos: oro, oliva y granate cruzando el papel. -->
  <path fill="none" stroke="url(#hilo-oro)" stroke-width="1.6"
        d="M-40 190C210 104 452 232 700 186C948 140 1160 52 1480 128"/>
  <path fill="none" stroke="url(#hilo-oliva)" stroke-width="1.3"
        d="M-40 612C246 548 470 664 742 612C1014 560 1216 486 1480 552"/>
  <path fill="none" stroke="url(#hilo-granate)" stroke-width="1.3"
        d="M-40 930C230 876 436 962 690 936C944 910 1204 834 1480 884"/>
</svg>
