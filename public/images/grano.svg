<svg xmlns="http://www.w3.org/2000/svg" width="180" height="180" viewBox="0 0 180 180" aria-hidden="true">
  <!--
    Grano para el cristal esmerilado de la cabecera. Ruido fractal generado por
    el propio SVG: no hay bitmap que cargar y no pesa nada. `baseFrequency` alta
    da un grano fino, de cristal, y no de textura de papel; tres octavas bastan
    para que no se lea el patrón al repetirse.
  -->
  <filter id="grano" x="0" y="0" width="100%" height="100%">
    <feTurbulence type="fractalNoise" baseFrequency="0.86" numOctaves="3" stitchTiles="stitch"/>
    <feColorMatrix type="saturate" values="0"/>
  </filter>
  <rect width="180" height="180" filter="url(#grano)"/>
</svg>
